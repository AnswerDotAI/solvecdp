[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "solvelink"
dynamic = ["version"]
description = "Lightweight Chrome DevTools Protocol (CDP) and macOS AppleScript client for Solveit"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Jeremy Howard", email = "github@jhoward.fastmail.fm"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "fastcdp>=0.0.7",
    "fastcore",
    "websockets>=14",
]

[project.optional-dependencies]
dev = [
    "fastship",
    "build",
    "twine",
    "pytest",
    "pytest-asyncio",
    "pytest-timeout",
]

[project.urls]
Homepage = "https://github.com/AnswerDotAI/solvelink"
Repository = "https://github.com/AnswerDotAI/solvelink"
Issues = "https://github.com/AnswerDotAI/solvelink/issues"
Documentation = "https://AnswerDotAI.github.io/solvelink/"

[tool.fastship]
branch = "main"

[tool.setuptools.dynamic]
version = { attr = "solvelink.__version__" }

[tool.setuptools.packages.find]
include = ["solvelink"]

[tool.pytest.ini_options]
addopts = "-p asyncio -p timeout"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
